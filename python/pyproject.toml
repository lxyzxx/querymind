[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind"
version = "0.1.0"
description = "AI2SQL semantic layer runtime with Python tool execution"
requires-python = ">=3.8"

dependencies = [
    "grpcio",
    "grpcio-tools",
    "pyyaml"
]

[tool.setuptools]
packages = [
    "querymind",
    "querymind.agent",
    "querymind.client",
    "querymind.server",
    "querymind.generated"
]

[project.scripts]
querymind-server = "querymind.server.main:main"
