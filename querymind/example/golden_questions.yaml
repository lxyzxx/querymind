questions:
  - id: active_user_count_by_status
    question: 按用户状态统计活跃用户数
    semantic_request:
      metric: user_count
      dimensions: [status]
      named_filters: [active_only]
      limit: 20
    expected_sql: >
      SELECT status AS status, count(*) AS user_count FROM public.querymind_demo_users
      WHERE (status = 'active') GROUP BY status ORDER BY user_count DESC LIMIT 20

  - id: total_user_count
    question: 统计总用户数
    semantic_request:
      metric: user_count
      dimensions: []
      named_filters: []
      limit: 50
    expected_sql: >
      SELECT count(*) AS user_count FROM public.querymind_demo_users LIMIT 50

  - id: user_count_by_signup_date_for_active_users
    question: 按注册日期统计活跃用户数
    semantic_request:
      metric: user_count
      dimensions: [signup_date]
      named_filters: [active_only]
      limit: 50
    expected_sql: >
      SELECT date(created_at) AS signup_date, count(*) AS user_count FROM public.querymind_demo_users
      WHERE (status = 'active') GROUP BY date(created_at) ORDER BY user_count DESC LIMIT 50

  - id: total_gmv
    question: GMV情况如何
    semantic_request:
      metric: gmv
      dimensions: []
      named_filters: []
      limit: 20
    expected_sql: >
      SELECT sum(case when status = 'paid' then amount else 0 end) AS gmv
      FROM public.querymind_demo_orders LIMIT 20

  - id: gmv_by_channel
    question: 哪个渠道GMV最高
    semantic_request:
      metric: gmv
      dimensions: [channel]
      named_filters: []
      limit: 20
    expected_sql: >
      SELECT channel AS channel, sum(case when status = 'paid' then amount else 0 end) AS gmv
      FROM public.querymind_demo_orders GROUP BY channel ORDER BY gmv DESC LIMIT 20

  - id: total_order_count
    question: 订单数情况如何
    semantic_request:
      metric: order_count
      dimensions: []
      named_filters: []
      limit: 20
    expected_sql: >
      SELECT sum(case when status = 'paid' then 1 else 0 end) AS order_count
      FROM public.querymind_demo_orders LIMIT 20

  - id: avg_order_value
    question: 客单价情况如何
    semantic_request:
      metric: avg_order_value
      dimensions: []
      named_filters: []
      limit: 20
    expected_sql: >
      SELECT avg(case when status = 'paid' then amount end) AS avg_order_value
      FROM public.querymind_demo_orders LIMIT 20

  - id: refund_metrics
    question: 退款金额和退款率
    semantic_request:
      metric: refund_amount
      dimensions: []
      named_filters: []
      limit: 20
    expected_sql: >
      SELECT sum(case when status = 'refunded' then amount else 0 end) AS refund_amount
      FROM public.querymind_demo_orders LIMIT 20

  - id: conversion_rate
    question: 转化率情况如何
    semantic_request:
      metric: conversion_rate
      dimensions: []
      named_filters: []
      limit: 20
    expected_sql: >
      SELECT avg(case when converted then 1.0 else 0.0 end) AS conversion_rate
      FROM public.querymind_demo_sessions LIMIT 20
