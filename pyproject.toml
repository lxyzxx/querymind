[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "querymind"
version = "0.1.0"
description = "Governed AI2SQL engine with a semantic layer and SQL guard"
requires-python = ">=3.8"

dependencies = [
    "pyyaml",
    "sqlglot>=25.0.0"
]

[tool.setuptools]
packages = [
    "querymind",
    "querymind.agent",
    "querymind.core",
    "querymind.llm",
    "querymind.server"
]

[tool.setuptools.package-data]
"querymind.server" = ["static/*.html"]
